<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suplementos Victoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --black: #0a0a0a; --gray: #888; --red: #ef4444; --radius: 8px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: #fff; color: var(--black); min-height: 100vh; }
    .header { position: sticky; top: 0; z-index: 100; background: var(--black); border-bottom: 1px solid #222; }
    .header-inner { max-width: 1300px; margin: 0 auto; padding: 0.7rem 1.5rem; display: flex; align-items: center; gap: 1.2rem; }
    .logo { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
    .logo-img { height: 48px; width: 48px; object-fit: contain; border-radius: 50%; }
    .nav { display: flex; gap: 0.3rem; flex: 1; flex-wrap: wrap; }
    .nav-btn { background: none; border: 1px solid transparent; color: var(--gray); font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; padding: 0.35rem 0.85rem; border-radius: 30px; cursor: pointer; transition: all 0.2s; }
    .nav-btn:hover, .nav-btn.active { color: #fff; border-color: #fff; background: rgba(255,255,255,0.08); }
    .cart-btn { position: relative; text-decoration: none; font-size: 1.4rem; flex-shrink: 0; transition: transform 0.2s; margin-left: auto; }
    .cart-btn:hover { transform: scale(1.1); }
    .cart-count { position: absolute; top: -6px; right: -8px; background: #fff; color: var(--black); font-size: 0.65rem; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif; }
    .hero { padding: 4rem 1.5rem 3rem; max-width: 1300px; margin: 0 auto; }
    .hero-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3.5rem, 9vw, 7rem); line-height: 0.92; letter-spacing: 2px; color: var(--black); }
    .hero-title em { font-style: normal; -webkit-text-stroke: 2px var(--black); -webkit-text-fill-color: transparent; }
    .hero-sub { margin-top: 1rem; color: var(--gray); font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; }
    .search-wrap { max-width: 1300px; margin: 0 auto; padding: 0 1.5rem; }
    .search-box { position: relative; }
    .search-input { width: 100%; background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 30px; padding: 0.8rem 3rem 0.8rem 3rem; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; color: var(--black); transition: border-color 0.2s, background 0.2s; outline: none; }
    .search-input:focus { border-color: var(--black); background: #fff; box-shadow: 0 0 0 3px rgba(10,10,10,0.06); }
    .search-input::placeholder { color: #bbb; }
    .search-icon { position: absolute; left: 1.1rem; top: 50%; transform: translateY(-50%); font-size: 1rem; pointer-events: none; }
    .search-clear { position: absolute; right: 1.1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: #bbb; font-size: 1rem; cursor: pointer; display: none; line-height: 1; padding: 0; }
    .search-clear.visible { display: block; }
    .search-clear:hover { color: var(--black); }
    .main { max-width: 1300px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }
    .section-header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.5rem; }
    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 4px; color: var(--black); }
    .product-count { color: var(--gray); font-size: 0.85rem; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .loading { color: var(--gray); grid-column: 1/-1; text-align: center; padding: 3rem; }
    .product-card { background: #fff; border: 1px solid #e5e5e5; border-radius: var(--radius); overflow: hidden; transition: transform 0.2s, border-color 0.2s; }
    .product-card:hover { transform: translateY(-3px); border-color: #aaa; }
    .product-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #f5f5f5; display: block; }
    .product-img-placeholder { width: 100%; aspect-ratio: 1; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    .product-info { padding: 1rem; }
    .product-cat { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: #aaa; margin-bottom: 0.3rem; }
    .product-name { font-size: 0.95rem; font-weight: 600; color: var(--black); margin-bottom: 0.3rem; line-height: 1.3; }
    .product-desc { font-size: 0.78rem; color: var(--gray); margin-bottom: 0.8rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 0.5rem; }
    .product-price { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 1px; color: var(--black); }
    .btn-add { background: var(--black); color: #fff; border: none; border-radius: 6px; padding: 0.5rem 0.9rem; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-add:hover { background: #333; }
    .btn-add:active { transform: scale(0.96); }
    .product-stock-out { font-size: 0.75rem; color: var(--red); font-weight: 500; }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--black); color: #fff; padding: 0.8rem 1.5rem; border-radius: 30px; font-size: 0.85rem; font-weight: 500; opacity: 0; transition: all 0.3s ease; z-index: 999; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .footer { text-align: center; padding: 2rem; color: var(--gray); font-size: 0.8rem; border-top: 1px solid #e5e5e5; }
    
    .variant-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; display: none; align-items: center; justify-content: center; padding: 1.5rem; }
    .variant-modal.open { display: flex; }
    .variant-box { background: #fff; border-radius: 12px; padding: 1.5rem; max-width: 320px; width: 100%; }
    .variant-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 1rem; }
    .variant-select { width: 100%; padding: 0.7rem; border: 1px solid #ddd; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; margin-bottom: 1rem; }
    .variant-actions { display: flex; gap: 0.5rem; }
    .btn-variant { flex: 1; padding: 0.7rem; border: none; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .btn-variant-cancel { background: #f5f5f5; color: var(--black); }
    .btn-variant-add { background: var(--black); color: #fff; }
    @media (max-width: 640px) { .nav { display: none; } .hero-title { font-size: 3rem; } }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="logo.jpeg" alt="Suplementos Victoria" class="logo-img" />
      </a>
      <nav class="nav">
        <button class="nav-btn active" data-cat="todos">Todos</button>
        <button class="nav-btn" data-cat="proteinas">Proteínas</button>
        <button class="nav-btn" data-cat="creatina">Creatina</button>
        <button class="nav-btn" data-cat="vitaminas">Vitaminas</button>
        <button class="nav-btn" data-cat="aminoacidos">Aminoácidos</button>
        <button class="nav-btn" data-cat="otros">Otros</button>
      </nav>
      <a href="carrito.html" class="cart-btn">
        🛒<span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </header>

  <section class="hero">
    <h1 class="hero-title" id="heroTitulo">SUPLEMENTOS<br><em>QUE DAN</em><br>RESULTADOS</h1>
    <p class="hero-sub" id="heroSubtitulo">Calidad premium · Precios reales · Envíos a todo el país</p>
  </section>

  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar producto..." oninput="onSearch(this.value)" />
      <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <main class="main">
    <div class="section-header">
      <h2 class="section-title">NUESTROS PRODUCTOS</h2>
      <p id="productCount" class="product-count"></p>
    </div>
    <div class="products-grid" id="productsGrid">
      <div class="loading">Cargando productos...</div>
    </div>
  </main>

  <div class="variant-modal" id="variantModal">
    <div class="variant-box">
      <h3 class="variant-title" id="variantProductName"></h3>
      <select class="variant-select" id="variantSelect"></select>
      <div class="variant-actions">
        <button class="btn-variant btn-variant-cancel" onclick="closeVariantModal()">Cancelar</button>
        <button class="btn-variant btn-variant-add" onclick="confirmVariant()">Agregar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer class="footer">
    <p id="footerTexto">© 2025 Suplementos Victoria · Hecho con 💪</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://rxspgxibqcrrwnvsqkev.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_HCGeovR47W3wJiMWQ3yqlQ_gtQ0vVyj';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadConfig() {
      const { data } = await db.from('configuracion').select('*');
      if (!data) return;
      const cfg = Object.fromEntries(data.map(r => [r.clave, r.valor]));
      if (cfg.hero_titulo) document.getElementById('heroTitulo').innerHTML = cfg.hero_titulo;
      if (cfg.hero_subtitulo) document.getElementById('heroSubtitulo').textContent = cfg.hero_subtitulo;
      if (cfg.footer_texto) document.getElementById('footerTexto').textContent = cfg.footer_texto;
      if (cfg.color_principal) document.documentElement.style.setProperty('--black', cfg.color_principal);
    }

    function getCart() { return JSON.parse(localStorage.getItem('sv_cart') || '[]'); }
    function saveCart(cart) { localStorage.setItem('sv_cart', JSON.stringify(cart)); updateCartCount(); }
    function updateCartCount() {
      const total = getCart().reduce((s, i) => s + i.qty, 0);
      const el = document.getElementById('cartCount');
      el.textContent = total;
      el.style.display = total > 0 ? 'flex' : 'none';
    }
    
    let pendingProduct = null;
    
    function addToCart(product, varianteName = null) {
      if (product.variantes && product.variantes.length > 0 && !varianteName) {
        pendingProduct = product;
        document.getElementById('variantProductName').textContent = product.nombre;
        const select = document.getElementById('variantSelect');
        select.innerHTML = product.variantes.map(v => 
          `<option value="${v.nombre}" ${v.stock <= 0 ? 'disabled' : ''}>${v.nombre}${v.stock <= 0 ? ' (Sin stock)' : ` (Stock: ${v.stock})`}</option>`
        ).join('');
        document.getElementById('variantModal').classList.add('open');
        return;
      }

      const cart = getCart();
      const cartKey = varianteName ? `${product.id}_${varianteName}` : product.id;
      const existing = cart.find(i => i.cartKey === cartKey);
      
      let maxStock = product.stock;
      if (varianteName && product.variantes) {
        const variant = product.variantes.find(v => v.nombre === varianteName);
        maxStock = variant ? variant.stock : 0;
      }

      if (existing) {
        if (maxStock !== null && existing.qty >= maxStock) {
          showToast('⚠️ No hay más stock disponible');
          return;
        }
        existing.qty++;
      } else {
        cart.push({ 
          ...product, 
          cartKey, 
          variante: varianteName,
          stock: maxStock,
          qty: 1 
        });
      }
      saveCart(cart);
      showToast('✅ ' + product.nombre + (varianteName ? ` (${varianteName})` : '') + ' agregado al carrito');
    }

    function closeVariantModal() {
      document.getElementById('variantModal').classList.remove('open');
      pendingProduct = null;
    }

    function confirmVariant() {
      const varianteName = document.getElementById('variantSelect').value;
      if (pendingProduct && varianteName) {
        addToCart(pendingProduct, varianteName);
        closeVariantModal();
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
    function formatPrice(n) { return '$' + Number(n).toLocaleString('es-AR'); }

    let allProducts = [], currentCat = 'todos', searchQuery = '';

    async function loadProducts() {
      const grid = document.getElementById('productsGrid');
      try {
        const { data, error } = await db.from('productos').select('*').order('nombre');
        if (error) throw error;
        
        for (const p of data) {
          const { data: vars } = await db.from('variantes').select('*').eq('producto_id', p.id);
          p.variantes = vars || [];
        }
        
        allProducts = data || [];
        renderProducts();
      } catch (err) {
        grid.innerHTML = '<div class="loading">Error al cargar productos.</div>';
      }
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const countEl = document.getElementById('productCount');
      let filtered = currentCat === 'todos' ? allProducts : allProducts.filter(p => p.categoria === currentCat);
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(p =>
          p.nombre.toLowerCase().includes(q) ||
          (p.descripcion && p.descripcion.toLowerCase().includes(q)) ||
          (p.categoria && p.categoria.toLowerCase().includes(q))
        );
      }
      countEl.textContent = filtered.length + ' producto' + (filtered.length !== 1 ? 's' : '');
      if (!filtered.length) {
        grid.innerHTML = '<div class="loading">No se encontraron productos' + (searchQuery ? ' para "' + searchQuery + '"' : '') + '.</div>';
        return;
      }
      grid.innerHTML = filtered.map(p => {
        let hasStock = false;
        if (p.variantes && p.variantes.length > 0) {
          hasStock = p.variantes.some(v => v.stock > 0);
        } else {
          hasStock = p.stock > 0 || p.stock === null;
        }
        
        return `
        <div class="product-card">
          ${p.imagen_url ? `<img class="product-img" src="${p.imagen_url}" alt="${p.nombre}" loading="lazy" />` : `<div class="product-img-placeholder">💪</div>`}
          <div class="product-info">
            <p class="product-cat">${p.categoria || 'Suplemento'}</p>
            <h3 class="product-name">${p.nombre}</h3>
            ${p.descripcion ? `<p class="product-desc">${p.descripcion}</p>` : ''}
            <div class="product-footer">
              <span class="product-price">${formatPrice(p.precio)}</span>
              ${hasStock ? `<button class="btn-add" onclick='addToCart(${JSON.stringify(p)})'>+ Agregar</button>` : `<span class="product-stock-out">Sin stock</span>`}
            </div>
          </div>
        </div>`}).join('');
    }

    function onSearch(val) {
      searchQuery = val.trim();
      document.getElementById('searchClear').classList.toggle('visible', searchQuery.length > 0);
      renderProducts();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      searchQuery = '';
      document.getElementById('searchClear').classList.remove('visible');
      renderProducts();
    }

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = btn.dataset.cat;
        renderProducts();
      });
    });

    document.addEventListener('DOMContentLoaded', () => { loadConfig(); updateCartCount(); loadProducts(); });
  </script>
</body>
</html>
