<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suplementos Victoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --black: #0a0a0a; --gray: #888; --red: #ef4444; --radius: 8px; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'DM Sans', sans-serif; background: #fff; color: var(--black); min-height: 100vh; }
    .header { position: sticky; top: 0; z-index: 100; background: var(--black); border-bottom: 1px solid #222; }
    .header-inner { max-width: 1300px; margin: 0 auto; padding: 0.7rem 1.5rem; display: flex; align-items: center; gap: 1.2rem; }
    .logo { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
    .logo-img { height: 48px; width: 48px; object-fit: contain; border-radius: 50%; }
    .nav { display: flex; gap: 0.3rem; flex: 1; flex-wrap: wrap; }
    .nav-btn { background: none; border: 1px solid transparent; color: var(--gray); font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; padding: 0.35rem 0.85rem; border-radius: 30px; cursor: pointer; transition: all 0.2s; }
    .nav-btn:hover, .nav-btn.active { color: #fff; border-color: #fff; background: rgba(255,255,255,0.08); }
    .cart-btn { position: relative; text-decoration: none; font-size: 1.4rem; flex-shrink: 0; transition: transform 0.2s; margin-left: auto; }
    .cart-btn:hover { transform: scale(1.1); }
    .cart-count { position: absolute; top: -6px; right: -8px; background: #fff; color: var(--black); font-size: 0.65rem; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; display: none; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif; }
    .hero { padding: 4rem 1.5rem 3rem; max-width: 1300px; margin: 0 auto; }
    .hero-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3.5rem, 9vw, 7rem); line-height: 0.92; letter-spacing: 2px; color: var(--black); }
    .hero-title em { font-style: normal; -webkit-text-stroke: 2px var(--black); -webkit-text-fill-color: transparent; }
    .hero-sub { margin-top: 1rem; color: var(--gray); font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; }
    .main { max-width: 1300px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }
    .section-header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.5rem; }
    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 4px; color: var(--black); }
    .product-count { color: var(--gray); font-size: 0.85rem; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
    .loading { color: var(--gray); grid-column: 1/-1; text-align: center; padding: 3rem; }
    .product-card { background: #fff; border: 1px solid #e5e5e5; border-radius: var(--radius); overflow: hidden; transition: transform 0.2s, border-color 0.2s; }
    .product-card:hover { transform: translateY(-3px); border-color: #aaa; }
    .product-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #f5f5f5; display: block; }
    .product-img-placeholder { width: 100%; aspect-ratio: 1; background: #f5f5f5; display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    .product-info { padding: 1rem; }
    .product-cat { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: #aaa; margin-bottom: 0.3rem; }
    .product-name { font-size: 0.95rem; font-weight: 600; color: var(--black); margin-bottom: 0.3rem; line-height: 1.3; }
    .product-desc { font-size: 0.78rem; color: var(--gray); margin-bottom: 0.8rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 0.5rem; }
    .product-price { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 1px; color: var(--black); }
    .btn-add { background: var(--black); color: #fff; border: none; border-radius: 6px; padding: 0.5rem 0.9rem; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-add:hover { background: #333; }
    .btn-add:active { transform: scale(0.96); }
    .product-stock-out { font-size: 0.75rem; color: var(--red); font-weight: 500; }
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--black); color: #fff; padding: 0.8rem 1.5rem; border-radius: 30px; font-size: 0.85rem; font-weight: 500; opacity: 0; transition: all 0.3s ease; z-index: 999; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .footer { text-align: center; padding: 2rem; color: var(--gray); font-size: 0.8rem; border-top: 1px solid #e5e5e5; }
    @media (max-width: 640px) { .nav { display: none; } .hero-title { font-size: 3rem; } }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="img/logo.jpeg" alt="Suplementos Victoria" class="logo-img" />
      </a>
      <nav class="nav">
        <button class="nav-btn active" data-cat="todos">Todos</button>
        <button class="nav-btn" data-cat="proteinas">Proteínas</button>
        <button class="nav-btn" data-cat="creatina">Creatina</button>
        <button class="nav-btn" data-cat="vitaminas">Vitaminas</button>
        <button class="nav-btn" data-cat="aminoacidos">Aminoácidos</button>
        <button class="nav-btn" data-cat="otros">Otros</button>
      </nav>
      <a href="carrito.html" class="cart-btn">
        🛒<span class="cart-count" id="cartCount">0</span>
      </a>
    </div>
  </header>

  <section class="hero">
    <h1 class="hero-title" id="heroTitulo">SUPLEMENTOS<br><em>QUE DAN</em><br>RESULTADOS</h1>
    <p class="hero-sub" id="heroSubtitulo">Calidad premium · Precios reales · Envíos a todo el país</p>
  </section>

  <main class="main">
    <div class="section-header">
      <h2 class="section-title">NUESTROS PRODUCTOS</h2>
      <p id="productCount" class="product-count"></p>
    </div>
    <div class="products-grid" id="productsGrid">
      <div class="loading">Cargando productos...</div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <footer class="footer">
    <p id="footerTexto">© 2025 Suplementos Victoria · Hecho con 💪</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://rxspgxibqcrrwnvsqkev.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_HCGeovR47W3wJiMWQ3yqlQ_gtQ0vVyj';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- CONFIG ---
    async function loadConfig() {
      const { data } = await db.from('configuracion').select('*');
      if (!data) return;
      const cfg = Object.fromEntries(data.map(r => [r.clave, r.valor]));
      if (cfg.hero_titulo) document.getElementById('heroTitulo').innerHTML = cfg.hero_titulo;
      if (cfg.hero_subtitulo) document.getElementById('heroSubtitulo').textContent = cfg.hero_subtitulo;
      if (cfg.footer_texto) document.getElementById('footerTexto').textContent = cfg.footer_texto;
      if (cfg.color_principal) {
        document.documentElement.style.setProperty('--black', cfg.color_principal);
      }
    }

    // --- CARRITO ---
    function getCart() { return JSON.parse(localStorage.getItem('sv_cart') || '[]'); }
    function saveCart(cart) { localStorage.setItem('sv_cart', JSON.stringify(cart)); updateCartCount(); }
    function updateCartCount() {
      const total = getCart().reduce((s, i) => s + i.qty, 0);
      const el = document.getElementById('cartCount');
      el.textContent = total;
      el.style.display = total > 0 ? 'flex' : 'none';
    }
    function addToCart(product) {
      const cart = getCart();
      const existing = cart.find(i => i.id === product.id);
      existing ? existing.qty++ : cart.push({ ...product, qty: 1 });
      saveCart(cart);
      showToast('✅ ' + product.nombre + ' agregado al carrito');
    }
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
    function formatPrice(n) { return '$' + Number(n).toLocaleString('es-AR'); }

    // --- PRODUCTOS ---
    let allProducts = [], currentCat = 'todos';
    async function loadProducts() {
      const grid = document.getElementById('productsGrid');
      try {
        const { data, error } = await db.from('productos').select('*').order('nombre');
        if (error) throw error;
        allProducts = data || [];
        renderProducts();
      } catch (err) {
        grid.innerHTML = '<div class="loading">Error al cargar productos.</div>';
      }
    }
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const countEl = document.getElementById('productCount');
      const filtered = currentCat === 'todos' ? allProducts : allProducts.filter(p => p.categoria === currentCat);
      countEl.textContent = filtered.length + ' producto' + (filtered.length !== 1 ? 's' : '');
      if (!filtered.length) { grid.innerHTML = '<div class="loading">No hay productos en esta categoría.</div>'; return; }
      grid.innerHTML = filtered.map(p => `
        <div class="product-card">
          ${p.imagen_url ? `<img class="product-img" src="${p.imagen_url}" alt="${p.nombre}" loading="lazy" />` : `<div class="product-img-placeholder">💪</div>`}
          <div class="product-info">
            <p class="product-cat">${p.categoria || 'Suplemento'}</p>
            <h3 class="product-name">${p.nombre}</h3>
            ${p.descripcion ? `<p class="product-desc">${p.descripcion}</p>` : ''}
            <div class="product-footer">
              <span class="product-price">${formatPrice(p.precio)}</span>
              ${p.stock > 0 || p.stock === null ? `<button class="btn-add" onclick='addToCart(${JSON.stringify(p)})'>+ Agregar</button>` : `<span class="product-stock-out">Sin stock</span>`}
            </div>
          </div>
        </div>`).join('');
    }
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = btn.dataset.cat;
        renderProducts();
      });
    });

    document.addEventListener('DOMContentLoaded', () => { loadConfig(); updateCartCount(); loadProducts(); });
  </script>
</body>
</html>
