<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Suplementos Victoria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* =============================================
       SUPLEMENTOS VICTORIA — admin.html
       ============================================= */
    :root {
      --black: #0a0a0a;
      --dark2: #1a1a1a;
      --dark3: #222;
      --white: #f5f5f0;
      --gray: #888;
      --red: #ef4444;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #f5f5f5; color: var(--black); min-height: 100vh; }

    /* HEADER */
    .header { position: sticky; top: 0; z-index: 100; background: var(--black); border-bottom: 1px solid #222; }
    .header-inner { max-width: 1300px; margin: 0 auto; padding: 0.7rem 1.5rem; display: flex; align-items: center; gap: 1.2rem; }
    .logo { display: flex; align-items: center; text-decoration: none; flex-shrink: 0; }
    .logo-img { height: 48px; width: 48px; object-fit: contain; border-radius: 50%; }
    .nav { display: flex; gap: 0.3rem; flex: 1; }
    .nav-btn { background: none; border: 1px solid transparent; color: var(--gray); font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; padding: 0.35rem 0.85rem; border-radius: 30px; cursor: pointer; transition: all 0.2s; }
    .nav-btn:hover, .nav-btn.active { color: #fff; border-color: #fff; background: rgba(255,255,255,0.08); }
    .btn-logout { background: none; border: 1px solid rgba(255,255,255,0.15); color: var(--gray); border-radius: 6px; padding: 0.4rem 0.9rem; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; cursor: pointer; transition: color 0.2s; margin-left: auto; }
    .btn-logout:hover { color: var(--red); border-color: var(--red); }

    /* LOGIN */
    .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; background: #f5f5f5; }
    .login-box { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 380px; }
    .login-logo { display: flex; justify-content: center; margin-bottom: 1.5rem; }
    .login-logo img { height: 80px; width: 80px; object-fit: contain; }
    .login-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 3px; text-align: center; margin-bottom: 1.5rem; }
    .login-error { color: var(--red); font-size: 0.8rem; margin-top: 0.5rem; text-align: center; }

    /* MAIN */
    .main { max-width: 1300px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 4px; color: var(--black); }
    .admin-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }

    /* TABLE */
    .admin-table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid #e5e5e5; background: #fff; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .admin-table th { background: #f9f9f9; padding: 0.8rem 1rem; text-align: left; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); font-weight: 500; }
    .admin-table td { padding: 0.8rem 1rem; border-top: 1px solid #f0f0f0; vertical-align: middle; }
    .admin-table tr:hover td { background: #fafafa; }
    .admin-thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #f5f5f5; }
    .admin-thumb-placeholder { width: 44px; height: 44px; background: #f5f5f5; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
    .tag-cat { font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; background: #f0f0f0; color: #555; padding: 0.2rem 0.6rem; border-radius: 20px; }

    /* BUTTONS */
    .btn-primary { display: inline-block; background: var(--black); color: #fff; border: none; border-radius: var(--radius); padding: 0.7rem 1.4rem; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 700; cursor: pointer; text-decoration: none; transition: background 0.2s; }
    .btn-primary:hover { background: #333; }
    .btn-secondary { display: inline-block; background: transparent; color: var(--black); border: 1px solid #ddd; border-radius: var(--radius); padding: 0.7rem 1.4rem; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; cursor: pointer; transition: border-color 0.2s; }
    .btn-secondary:hover { border-color: var(--black); }
    .btn-edit { background: none; border: 1px solid #ddd; color: var(--black); border-radius: 5px; padding: 0.35rem 0.7rem; font-size: 0.78rem; cursor: pointer; margin-right: 0.3rem; transition: border-color 0.2s; font-family: 'DM Sans', sans-serif; }
    .btn-edit:hover { border-color: var(--black); }
    .btn-del { background: none; border: 1px solid rgba(239,68,68,0.3); color: var(--red); border-radius: 5px; padding: 0.35rem 0.7rem; font-size: 0.78rem; cursor: pointer; transition: background 0.2s; font-family: 'DM Sans', sans-serif; }
    .btn-del:hover { background: rgba(239,68,68,0.08); }

    /* FORM */
    .form-input { width: 100%; background: #fff; border: 1px solid #ddd; border-radius: 6px; color: var(--black); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; padding: 0.65rem 0.9rem; margin-bottom: 0.6rem; transition: border-color 0.2s; resize: vertical; }
    .form-input:focus { outline: none; border-color: var(--black); }
    .form-label { display: block; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; color: var(--gray); margin-bottom: 0.3rem; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; align-items: center; justify-content: center; padding: 1.5rem; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 2rem; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 3px; margin-bottom: 1.2rem; }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
    .modal-actions { display: flex; gap: 0.8rem; justify-content: flex-end; margin-top: 1rem; }
    @media (max-width: 640px) { .modal-grid { grid-template-columns: 1fr; } }

    /* TOAST */
    .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--black); color: #fff; padding: 0.8rem 1.5rem; border-radius: 30px; font-size: 0.85rem; font-weight: 500; opacity: 0; transition: all 0.3s ease; z-index: 999; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* PEDIDOS */
    .pedidos-note { color: var(--gray); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .pedidos-coming { text-align: center; padding: 4rem; color: var(--gray); font-size: 1.1rem; border: 1px dashed #ddd; border-radius: var(--radius); background: #fff; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <div class="login-logo">
        <img src="img/logo.jpeg" alt="Suplementos Victoria" />
      </div>
      <h2 class="login-title">PANEL ADMIN</h2>
      <input type="email" id="loginEmail" placeholder="Email" class="form-input" />
      <input type="password" id="loginPass" placeholder="Contraseña" class="form-input" onkeydown="if(event.key==='Enter') adminLogin()" />
      <button class="btn-primary" style="width:100%;margin-top:0.5rem" onclick="adminLogin()">Entrar</button>
      <p class="login-error" id="loginError"></p>
    </div>
  </div>

  <!-- PANEL -->
  <div id="adminPanel" style="display:none">
    <header class="header">
      <div class="header-inner">
        <a href="index.html" class="logo">
          <img src="img/logo.jpeg" alt="Suplementos Victoria" class="logo-img" />
        </a>
        <nav class="nav">
          <button class="nav-btn active" onclick="showTab('productos', this)">Productos</button>
          <button class="nav-btn" onclick="showTab('pedidos', this)">Pedidos</button>
        </nav>
        <button class="btn-logout" onclick="adminLogout()">Salir</button>
      </div>
    </header>

    <main class="main">
      <div id="tabProductos">
        <div class="admin-toolbar">
          <h2 class="section-title">PRODUCTOS</h2>
          <button class="btn-primary" onclick="openModal()">+ Nuevo producto</button>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Imagen</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th>
              </tr>
            </thead>
            <tbody id="adminProductList"></tbody>
          </table>
        </div>
      </div>

      <div id="tabPedidos" style="display:none">
        <h2 class="section-title" style="margin-bottom:1rem">PEDIDOS</h2>
        <p class="pedidos-note">Los pedidos llegan por WhatsApp. Próximamente podrás registrarlos acá.</p>
        <div class="pedidos-coming">🚧 Próximamente</div>
      </div>
    </main>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal">
      <h3 class="modal-title" id="modalTitle">NUEVO PRODUCTO</h3>
      <input type="hidden" id="editId" />
      <div class="modal-grid">
        <div>
          <label class="form-label">Nombre *</label>
          <input type="text" id="pNombre" class="form-input" placeholder="Proteína Whey Chocolate" />
        </div>
        <div>
          <label class="form-label">Categoría *</label>
          <select id="pCategoria" class="form-input">
            <option value="proteinas">Proteínas</option>
            <option value="creatina">Creatina</option>
            <option value="vitaminas">Vitaminas</option>
            <option value="aminoacidos">Aminoácidos</option>
            <option value="otros">Otros</option>
          </select>
        </div>
        <div>
          <label class="form-label">Precio (ARS) *</label>
          <input type="number" id="pPrecio" class="form-input" placeholder="15000" />
        </div>
        <div>
          <label class="form-label">Stock</label>
          <input type="number" id="pStock" class="form-input" placeholder="50" />
        </div>
      </div>
      <label class="form-label">Descripción</label>
      <textarea id="pDescripcion" class="form-input" rows="2" placeholder="Descripción del producto..."></textarea>
      <label class="form-label">URL de imagen</label>
      <input type="text" id="pImagen" class="form-input" placeholder="https://..." />
      <div class="modal-actions">
        <button class="btn-secondary" onclick="document.getElementById('modalOverlay').classList.remove('open')">Cancelar</button>
        <button class="btn-primary" onclick="saveProduct()">Guardar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // =============================================
    // ⚠️ REEMPLAZÁ ESTOS VALORES CON LOS TUYOS
    // =============================================
    const SUPABASE_URL = https://rxspgxibqcrrwnvsqkev.supabase.co/rest/v1/;
    const SUPABASE_ANON_KEY = sb_publishable_HCGeovR47W3wJiMWQ3yqlQ_gtQ0vVyj;

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    // AUTH
    async function adminLogin() {
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPass').value;
      const errEl = document.getElementById('loginError');
      const { error } = await db.auth.signInWithPassword({ email, password: pass });
      if (error) { errEl.textContent = 'Email o contraseña incorrectos'; return; }
      showPanel();
    }
    async function adminLogout() {
      await db.auth.signOut();
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
    }
    async function checkSession() {
      const { data: { session } } = await db.auth.getSession();
      if (session) showPanel();
    }
    function showPanel() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      loadAdminProducts();
    }

    // TABS
    function showTab(tab, el) {
      document.getElementById('tabProductos').style.display = tab === 'productos' ? 'block' : 'none';
      document.getElementById('tabPedidos').style.display = tab === 'pedidos' ? 'block' : 'none';
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    // PRODUCTOS
    async function loadAdminProducts() {
      const tbody = document.getElementById('adminProductList');
      tbody.innerHTML = '<tr><td colspan="6" style="color:#888;padding:1.5rem">Cargando...</td></tr>';
      const { data, error } = await db.from('productos').select('*').order('nombre');
      if (error) { tbody.innerHTML = '<tr><td colspan="6" style="color:red">Error al cargar</td></tr>'; return; }
      if (!data.length) { tbody.innerHTML = '<tr><td colspan="6" style="color:#888;padding:1.5rem;text-align:center">No hay productos aún. Creá el primero.</td></tr>'; return; }
      tbody.innerHTML = data.map(p => `
        <tr>
          <td>${p.imagen_url ? `<img class="admin-thumb" src="${p.imagen_url}" alt="${p.nombre}" />` : `<div class="admin-thumb-placeholder">💪</div>`}</td>
          <td style="font-weight:600">${p.nombre}</td>
          <td><span class="tag-cat">${p.categoria || '-'}</span></td>
          <td style="font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:1px">$${Number(p.precio).toLocaleString('es-AR')}</td>
          <td>${p.stock !== null ? p.stock : '∞'}</td>
          <td>
            <button class="btn-edit" onclick='openModal(${JSON.stringify(p)})'>Editar</button>
            <button class="btn-del" onclick="deleteProduct(${p.id})">Eliminar</button>
          </td>
        </tr>`).join('');
    }

    // MODAL
    function openModal(product = null) {
      document.getElementById('modalOverlay').classList.add('open');
      document.getElementById('modalTitle').textContent = product ? 'EDITAR PRODUCTO' : 'NUEVO PRODUCTO';
      document.getElementById('editId').value = product?.id || '';
      document.getElementById('pNombre').value = product?.nombre || '';
      document.getElementById('pCategoria').value = product?.categoria || 'proteinas';
      document.getElementById('pPrecio').value = product?.precio || '';
      document.getElementById('pStock').value = product?.stock ?? '';
      document.getElementById('pDescripcion').value = product?.descripcion || '';
      document.getElementById('pImagen').value = product?.imagen_url || '';
    }
    function closeModal(e) {
      if (e && e.target !== document.getElementById('modalOverlay')) return;
      document.getElementById('modalOverlay').classList.remove('open');
    }
    async function saveProduct() {
      const id = document.getElementById('editId').value;
      const nombre = document.getElementById('pNombre').value.trim();
      const precio = parseFloat(document.getElementById('pPrecio').value);
      if (!nombre || isNaN(precio)) { alert('Nombre y precio son obligatorios'); return; }
      const payload = {
        nombre,
        categoria: document.getElementById('pCategoria').value,
        precio,
        stock: document.getElementById('pStock').value !== '' ? parseInt(document.getElementById('pStock').value) : null,
        descripcion: document.getElementById('pDescripcion').value.trim() || null,
        imagen_url: document.getElementById('pImagen').value.trim() || null,
      };
      const { error } = id
        ? await db.from('productos').update(payload).eq('id', id)
        : await db.from('productos').insert(payload);
      if (error) { alert('Error al guardar: ' + error.message); return; }
      document.getElementById('modalOverlay').classList.remove('open');
      showToast(id ? '✅ Producto actualizado' : '✅ Producto creado');
      loadAdminProducts();
    }
    async function deleteProduct(id) {
      if (!confirm('¿Eliminar este producto?')) return;
      const { error } = await db.from('productos').delete().eq('id', id);
      if (error) { alert('Error: ' + error.message); return; }
      showToast('🗑️ Producto eliminado');
      loadAdminProducts();
    }

    document.addEventListener('DOMContentLoaded', checkSession);
  </script>
</body>
</html>
